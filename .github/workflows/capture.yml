name: Capture real Windows screens
on:
  push:
    paths:
      - 'capture/*.ps1'
  workflow_dispatch:
    inputs:
      script:
        description: 'capture/<name>.ps1 to run'
        required: false
permissions:
  contents: write
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pick scripts
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.script }}" ]; then echo "${{ github.event.inputs.script }}" > changed.txt
          else git diff --name-only HEAD~1 HEAD -- 'capture/*.ps1' > changed.txt || true; fi
          cat changed.txt
      - name: Capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($f in Get-Content changed.txt) {
            if (-not $f) { continue }
            Write-Host "=== $f"
            try { & powershell -NoProfile -ExecutionPolicy Bypass -File $f } catch { Write-Host "FAILED $f : $_" }
          }
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A captures || true
          git diff --cached --quiet && exit 0
          git commit -m "Real Windows capture"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
