name: Real sound packs
on:
  push:
    paths:
      - 'engine/sfx_sources.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 packs
        run: |
          set -e
          sudo apt-get install -y -qq ffmpeg unzip >/dev/null || true
          mkdir -p engine/sfx/kenney /tmp/k
          grep -v '^#' engine/sfx_sources.txt | while read page; do
            [ -z "$page" ] && continue
            name=$(basename "$page")
            zip=$(curl -fsSL "$page" | grep -oE 'https://kenney\.nl/media/pages/assets/[^"]+\.zip' | head -1 || true)
            if [ -z "$zip" ]; then
              # the same CC0 pack is also published on OpenGameArt
              zip=$(curl -fsSL "https://opengameart.org/content/$name" | grep -oE 'https://opengameart\.org/sites/default/files/[^"]+\.zip' | head -1 || true)
            fi
            echo "$name -> $zip"
            [ -z "$zip" ] && continue
            curl -fsSL -o /tmp/k/$name.zip "$zip" || continue
            mkdir -p /tmp/k/$name && unzip -q -o /tmp/k/$name.zip -d /tmp/k/$name
            mkdir -p engine/sfx/kenney/$name
            find /tmp/k/$name -name '*.ogg' | while read f; do
              b=$(basename "$f" .ogg)
              ffmpeg -v error -y -i "$f" -ac 1 -ar 48000 "engine/sfx/kenney/$name/$b.wav"
            done
            find /tmp/k/$name -iname 'license*' -exec cp {} engine/sfx/kenney/$name/ \; || true
            ls engine/sfx/kenney/$name | head -100
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A engine/sfx
          git diff --cached --quiet && exit 0
          git commit -m "Real CC0 sound packs (Kenney)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
