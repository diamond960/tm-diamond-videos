name: Voice and timings
on:
  push:
    paths:
      - 'jobs/**.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
          pip install -q "kokoro>=0.9.4" soundfile faster-whisper==1.1.1
      - name: Run jobs
        run: python3 engine/voice_jobs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Voice and timings"
          git pull --rebase -q || true
          git push
